<script type="text/javascript">

    jQuery(document).ready(function () {

        $('.date-picker').datepicker({
            autoclose: true,
            format: 'yyyy-mm-dd'
        });

            });

    function getViewLaw(element, lawId) {
		
        var $this = $(element);
        var $__mainContent = $this.closest('.shine-huuli-body').find('.lawcontent_' + lawId);
        var $mainContent = $this.closest('.shine-huuli-body').find('.content_' + lawId);
        
        if (typeof $this.attr('data-status') !== 'undefined' && $this.attr('data-status') === 'open') {
            $this.attr('data-status', 'close');
            $__mainContent.hide();
            return;
        }
        
        if ($mainContent.children().length > 0) {
            $this.attr('data-status', 'open');
            $__mainContent.show();
            return;
        }


		window.open('https://legalinfo.mn/mn/detail?lawId=' + lawId + '&showType=1', '_blank');
		return;
		
		location.href= 'https://legalinfo.mn/mn/detail?lawId=' + lawId + '&showType=1';
        
        $.ajax({
            type: 'post',
            dataType: 'json',
            url: "https://legalinfo.mn/mn/additionalLaw",
            data: {
                lawId: lawId,
                type: '1',
            },
            beforeSend: function() {
                $('.lawadditional').hide();
                Core.blockUI();
            },
            success: function(response) {
                $mainContent.empty().append(response.Html).promise().done(function () {
                    $__mainContent.show();
                    if (typeof response.isvalid !== 'undefined' && response.isvalid !== '1') {
                        $mainContent.addClass('huchingui-huuli');
                    }
                    $this.attr('data-status', 'open');
                    scroll2top();
                    if (typeof response.ed !== 'undefined' && response.ed === '3') {
                        $mainContent.addClass('p-0');
                    }
                });
                Core.unblockUI();

            },
            error: function (jqXHR, exception) {
                Core.unblockUI();
                Core.showErrorMessage(jqXHR, exception);
            }
        });
    }

    function ajaxPageAddi (element, pageCount) {
    var $this = $(element),
        $parent = $this.closest('.tab-col'),
        $parentContent = $this.closest('.shine-huuli-inner-container');
        $.ajax({
            type: 'post',
            dataType: 'json',
            url: URL_APP + URL_LANG + "/lawConnectedTypeData",
            data: {
                dvid: '1594091809248',
                type: '3',
                lawId: '16390150734701',
                annexId: '',
                pageCount: pageCount,
                title: $parentContent.find('input[name="title"]').val(),
                enacteddate: $parentContent.find('input[name="enacteddate"]').val(),
            },
            beforeSend: function () {
                Core.blockUI('section.tw-shine-huuli');
            },
            success: function (response) {
                $parentContent.find('#active-tab-3').empty().append(response.Html);
                Core.unblockUI();
            },
            error: function (jqXHR, exception) {
                Core.unblockUI();
                Core.showErrorMessage(jqXHR, exception);
            }
        });
    }

</script>
